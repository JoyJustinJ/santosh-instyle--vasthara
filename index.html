<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Santhosh Silks | Vastra - Tradition Meets Tomorrow. Manage your silk savings and schemes easily." />
  <meta name="theme-color" content="#38050D" />
  
  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Santhosh Silks | VASTRA" />
  <meta property="og:description" content="Santhosh Silks | Vastra - Tradition Meets Tomorrow." />
  <meta property="og:image" content="/assets/brand_logo_header.png" />
  
  <link rel="icon" type="image/png" href="/assets/brand_logo_header.png" />
  <link rel="apple-touch-icon" href="/assets/brand_logo_header.png" />
  <title>Santhosh Silks | VASTRA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Inline Splash Screen: shown immediately, no JS needed, hides when React mounts -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    #app-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      object-fit: cover;
    }
    #app-splash .splash-title {
      margin-top: 20px;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 1px;
    }
    #app-splash .splash-subtitle {
      margin-top: 6px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #app-splash .splash-loader {
      margin-top: 40px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Splash Screen (visible until React hydrates) -->
  <div id="app-splash">
    <img src="/vastra-logo.jpg" alt="Vastra Logo" />
    <div class="splash-title">VASTRA</div>
    <div class="splash-subtitle">Financial Services</div>
    <div class="splash-loader"></div>
  </div>

  <div id="root"></div>
  <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
